name: Compatibility report
description: Report compatibility with current and previous Codex Native Workers releases
title: "[Compatibility]: "
body:
  - type: markdown
    attributes:
      value: |
        Success reports are welcome. They help us understand OS compatibility, fresh installs, upgrades, Sol and Luna delegation, and current Coordinator/Workers Receipt or legacy Delegation Receipt behavior across current and previous Codex Native Workers releases. Reports are public GitHub Issues only.

        Stable describes the tested configuration, routing, and transactional installation product; it does not guarantee host-enforced recursive isolation. Keep configuration/status evidence separate from actual native execution.

        **Privacy warning — read before submitting.** Before submitting, remove or redact secrets and private information, including API keys, access tokens, cookies, passwords, private repository credentials, personal email addresses, unnecessary absolute home-directory information, and proprietary source/code unless you intentionally choose to share it. Include only the minimum relevant logs, with secrets and private information removed or redacted. Do not upload the entire CODEX_HOME (the whole `CODEX_HOME`) unless specifically requested during later troubleshooting; never upload an archive of it or its private files.

  - type: input
    id: os
    attributes:
      label: OS
      description: Enter the operating system, or Unknown if you do not know it.
      placeholder: Windows 11 / macOS / Linux / Unknown
    validations:
      required: true

  - type: input
    id: codex_client_version
    attributes:
      label: Codex client/version
      description: Specify Desktop or CLI, its version, and local/WSL/remote execution. Enter Unknown if needed.
      placeholder: Codex Desktop 1.x / Unknown
    validations:
      required: true

  - type: input
    id: python_version
    attributes:
      label: Python version
      description: "Report the actual Skill launcher: python on Windows, python3 on macOS/Linux. Include its version or Unknown."
      placeholder: Python 3.11 / Unknown
    validations:
      required: true

  - type: dropdown
    id: release_channel
    attributes:
      label: Release channel
      description: Which version or candidate did you test?
      options:
        - "Current Stable (v4.3.1)"
        - "Previous Stable (v4.3.0)"
        - "Previous Stable (v4.2.0)"
        - "Previous Preview (v4.2.0-rc1)"
        - "Legacy Stable (v4.1.4)"
        - Other published version
        - Unknown
    validations:
      required: true

  - type: dropdown
    id: install_type
    attributes:
      label: Install type
      description: Which installation path did you test?
      options:
        - Fresh install
        - Upgrade
        - Already installed / normal usage
        - Unknown
    validations:
      required: true

  - type: input
    id: from_version
    attributes:
      label: From version
      description: Optional. For an upgrade, enter the version you upgraded from.
      placeholder: v4.3.1 / v4.3.0 / Unknown

  - type: input
    id: installed_version
    attributes:
      label: Installed / tested version
      description: Enter the version actually installed or tested, including the exact tag or commit when available.
      placeholder: v4.3.1 (or v4.3.0 / v4.2.0 / v4.2.0-rc1 / v4.1.4)
    validations:
      required: true

  - type: dropdown
    id: installation_result
    attributes:
      label: Installation result
      description: What was the installation result? Use NOT RUN or BLOCKED when this check did not reach a result.
      options:
        - "PASS"
        - "PASS with minor issue"
        - "FAIL"
        - "NOT RUN"
        - "BLOCKED"
    validations:
      required: true

  - type: dropdown
    id: configuration_status
    attributes:
      label: Configuration/status evidence
      description: What did installed configuration or a status check show? This is configuration evidence and does not prove that a native worker actually ran.
      options:
        - "Ready / configured"
        - "Not ready / mismatch"
        - "NOT RUN"
        - "BLOCKED"
        - Unknown
    validations:
      required: true

  - type: input
    id: daily_role
    attributes:
      label: Observed Luna role
      description: Optional. Enter the observed Luna role, or Unknown. A configured role is not proof of native delegation.
      placeholder: luna_max / Unknown

  - type: input
    id: sol_role
    attributes:
      label: Observed Sol role
      description: Optional. Enter the observed Sol role, or Unknown. A configured role is not proof of native delegation.
      placeholder: sol_max / Unknown

  - type: textarea
    id: coordinator_workers_receipt
    attributes:
      label: Coordinator/Workers Receipt (current format)
      description: Optional. Paste the observed current-format Receipt. If it was not emitted, write `No current receipt — NOT RUN` or `No current receipt — BLOCKED`. Receipt text is observational, not runtime attestation.
      placeholder: "Coordinator/Workers: delegated · luna_high ×2 · parallel"

  - type: textarea
    id: sol_only_receipt
    attributes:
      label: Legacy Sol-only Receipt (v4.1.4 legacy format)
      description: Optional. Paste an older `Sol/Luna:` Sol-only Receipt, or leave blank if none was observed. Do not treat it as current Coordinator/Workers runtime evidence.
      placeholder: "Sol/Luna: Sol-only · reasoning/architecture task"

  - type: textarea
    id: delegated_receipt
    attributes:
      label: Legacy delegated Sol/Luna Receipt (v4.1.4 legacy format)
      description: Optional. Paste an older `Sol/Luna:` delegated Receipt, or leave blank if none was observed. Do not treat it as current Coordinator/Workers runtime evidence.
      placeholder: "Sol/Luna: delegated · luna_max ×3 · parallel"

  - type: dropdown
    id: sol_delegation
    attributes:
      label: Observed native Sol delegation
      description: Was native Sol delegation observed in the tested task? Configuration alone does not count.
      options:
        - "Yes"
        - "No"
        - "NOT RUN"
        - "BLOCKED"
        - "Not tested"
    validations:
      required: true

  - type: dropdown
    id: luna_delegation
    attributes:
      label: Observed native Luna delegation
      description: Was native Luna delegation observed in the tested task? Configuration alone does not count.
      options:
        - "Yes"
        - "No"
        - "NOT RUN"
        - "BLOCKED"
        - "Not tested"
    validations:
      required: true

  - type: dropdown
    id: parallel_delegation
    attributes:
      label: Parallel delegation observed
      description: Did two or more native workers overlap? Include the actual Sol/Luna roles in the result; sequential execution is not parallel.
      options:
        - "Yes"
        - "No"
        - "NOT RUN"
        - "BLOCKED"
        - "Not tested"
    validations:
      required: true

  - type: dropdown
    id: usage_duration
    attributes:
      label: Approximate usage duration
      description: How long have you used this installation?
      options:
        - "Just installed"
        - "Less than 1 day"
        - "1–3 days"
        - "4–7 days"
        - "More than 1 week"
    validations:
      required: true

  - type: textarea
    id: problems_found
    attributes:
      label: Problems found
      description: Optional. Describe any problem or limitation; write None if no problems were found. Include only minimum relevant, redacted logs.

  - type: textarea
    id: overall_result
    attributes:
      label: Overall result
      description: Summarize what worked, what did not, and whether you would run this target again in this environment. Keep configuration evidence, actual native execution, NOT RUN, and BLOCKED checks distinct.
      placeholder: Works normally on my environment; native checks not run
    validations:
      required: true

  - type: checkboxes
    id: privacy_confirmation
    attributes:
      label: Privacy confirmation
      description: Confirm that the report is safe to make public.
      options:
        - label: I removed or redacted secrets and private information from this report.
          required: true
        - label: I did not upload the entire CODEX_HOME unless it was specifically requested later.
          required: true
