name: Bug report
description: Report a reproducible problem in current Stable v4.3.1, the previous v4.2.0-rc1 Preview, or legacy Stable v4.1.4
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve current Stable v4.3.1, the previous v4.2.0-rc1 Preview, or legacy Stable v4.1.4.

        Use this form for install, upgrade, selector, Coordinator/Workers delegation, Receipt classification, rollback, uninstall, or another deterministic runtime problem. v4.3.x uses GPT-6 Sol/Luna with live, cached or explicit basic routing; v4.2.0 and its rc1 Preview use the previous model generation; v4.1.4 legacy reports may be Luna-only. Report configuration/status evidence separately from actual native execution; include live/cached/basic routing in the relevant context. Stable does not guarantee host-enforced recursive isolation.

        **Privacy warning — read before submitting.** Before submitting, remove or redact secrets and private information, including API keys, access tokens, cookies, passwords, private repository credentials, personal email addresses, unnecessary absolute home-directory information, and proprietary source/code unless you intentionally choose to share it. Include only the minimum relevant logs, with secrets and private information removed or redacted. Do not upload the entire CODEX_HOME (the whole `CODEX_HOME`) unless specifically requested during later troubleshooting; never upload an archive of it or its private files.

  - type: input
    id: summary
    attributes:
      label: Problem summary
      description: What went wrong? Include the shortest useful symptom.
      placeholder: The selector reports an unexpected result after a fresh install
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      description: Enter the operating system, or Unknown if you do not know it.
      placeholder: Windows 11 / macOS / Linux / Unknown
    validations:
      required: true

  - type: input
    id: codex_client_version
    attributes:
      label: Codex client/version
      description: Specify Desktop or CLI, its version, and local/WSL/remote execution. Enter Unknown if needed.
      placeholder: Codex Desktop 1.x / Unknown
    validations:
      required: true

  - type: input
    id: python_version
    attributes:
      label: Python version
      description: "Report the actual Skill launcher: python on Windows, python3 on macOS/Linux. Include its version or Unknown."
      placeholder: Python 3.11 / Unknown
    validations:
      required: true

  - type: dropdown
    id: release_channel
    attributes:
      label: Release channel
      description: Which version or candidate did you test?
      options:
        - "Current Stable (v4.3.1)"
        - "Previous Stable (v4.3.0)"
        - "Previous Stable (v4.2.0)"
        - "Previous Preview (v4.2.0-rc1)"
        - "Legacy Stable (v4.1.4)"
        - Other published version
        - Unknown
    validations:
      required: true

  - type: dropdown
    id: install_type
    attributes:
      label: Install type
      description: Which installation path was involved?
      options:
        - Fresh install
        - Upgrade from an earlier Sol + Luna version
        - Already installed / normal usage
        - Unknown
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Project version / tag / commit
      description: Enter the actual release, tag, or exact commit under test. The placeholder is only an example.
      placeholder: v4.3.1 (or v4.3.0 / v4.2.0 / v4.2.0-rc1 / v4.1.4)
    validations:
      required: true

  - type: textarea
    id: receipt
    attributes:
      label: Coordinator/Workers Receipt (current format)
      description: |
        Paste the final current-format Receipt line, if one was emitted. Examples:
        - `Coordinator/Workers: delegated · sol_high ×1`
        - `Coordinator/Workers: delegated · luna_high ×2 · parallel`
        - `Coordinator/Workers: Coordinator-only · no independent work`
        If no current Receipt was emitted, enter `No Receipt`, `No Receipt — NOT RUN`, or `No Receipt — BLOCKED`. Legacy v4.1.4 users can put their historical Receipt in the next field.
        Receipt text is not runtime attestation.
    validations:
      required: true

  - type: textarea
    id: legacy_receipt
    attributes:
      label: Legacy Sol/Luna Receipt (v4.1.4 legacy format)
      description: |
        Optional. Paste an older `Sol/Luna:` Receipt separately. Examples:
        - `Sol/Luna: Sol-only · no independent bounded work`
        - `Sol/Luna: delegated · luna_max ×2 · parallel`
        Do not use a legacy Receipt as evidence of current Coordinator/Workers runtime behavior.
      placeholder: "Sol/Luna: delegated · luna_max ×2 · parallel"

  - type: dropdown
    id: configuration_status
    attributes:
      label: Configuration/status evidence
      description: What did installed configuration or a status check show? This is configuration evidence and does not prove that a native worker actually ran.
      options:
        - "Ready / configured"
        - "Not ready / mismatch"
        - "NOT RUN"
        - "BLOCKED"
        - Unknown
    validations:
      required: true

  - type: dropdown
    id: sol_run
    attributes:
      label: Observed native Sol delegation
      description: Did a native Sol child actually run in the affected task? Configuration alone does not count.
      options:
        - "Yes"
        - "No"
        - "Not sure"
        - "NOT RUN"
        - "BLOCKED"
    validations:
      required: true

  - type: dropdown
    id: luna_run
    attributes:
      label: Observed native Luna delegation
      description: Did a native Luna child actually run in the affected task? Configuration alone does not count.
      options:
        - "Yes"
        - "No"
        - "Not sure"
        - "NOT RUN"
        - "BLOCKED"
    validations:
      required: true

  - type: textarea
    id: minimal_logs
    attributes:
      label: Error / relevant logs
      description: Optional. Include only the minimum relevant, redacted excerpt. Never upload a full log, diagnostic bundle, or CODEX_HOME.
      render: text

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: List the shortest steps and the command or prompt that reproduces the problem. Replace private paths with placeholders.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Optional. Add relevant fresh-session, upgrade, validation, or project context without sharing private information.

  - type: checkboxes
    id: privacy_confirmation
    attributes:
      label: Privacy confirmation
      description: Confirm that the report is safe to make public.
      options:
        - label: I removed or redacted secrets and private information from this report.
          required: true
        - label: I did not upload the entire CODEX_HOME unless it was specifically requested later.
          required: true
